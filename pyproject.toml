[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rv32i-simulator"
version = "0.1.0"
description = "RISC-V (RV32IMC + Zicsr) instruction-set simulator with CLI and NiceGUI web UI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "AtomChidjai" },
]
keywords = ["risc-v", "rv32i", "simulator", "computer-architecture", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Assemblers",
]
dependencies = [
    "nicegui>=3.12.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
browser-test = [
    "pytest>=8.0",
    "selenium>=4.34",
]
lint = [
    "ruff>=0.12",
]

[project.urls]
Homepage = "https://github.com/AtomChidjai/RISC-V-SIM"
Repository = "https://github.com/AtomChidjai/RISC-V-SIM"
Issues = "https://github.com/AtomChidjai/RISC-V-SIM/issues"

[project.scripts]
rv32i = "rv32i.cli:main"
rv32i-gui = "gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rv32i*", "gui*", "programs*"]
exclude = ["tests*", "rv32i.backup*"]
namespaces = true

[tool.setuptools.package-data]
rv32i = ["scripts/*.ld"]
gui = ["assets/*.js", "assets/*.webp", "assets/vendor/*"]
programs = ["*.c", "*.s"]
"programs.examples" = ["*.c", "*.s"]
"programs.io" = ["*.c", "*.s"]
"programs.isa" = ["*.c", "*.s"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "browser: real-browser end-to-end tests (set RUN_BROWSER_TESTS=1)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["gui/assets/vendor"]

[tool.ruff.lint]
select = ["E4", "E9", "F"]
ignore = ["E402"]
